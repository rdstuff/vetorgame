<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>VETOR — endless procedural platformer</title>
<style>
  :root{
    --bg:#0a0b0f;
    --ink:#e9ecf2;
    --dim:#6b7280;
    --danger:#ff2f6d;
    --orb:#4fe3c1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:"SF Mono",ui-monospace,"Cascadia Mono","Consolas",monospace;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #c{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

/* ─────────────────────────────  SETUP  ───────────────────────────── */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* Paleta minimalista: fundo escuro, traços claros, um acento de perigo,
   um acento de coleta. Todo o "brilho" vem dos ataques inimigos.        */
const COL = {
  bg      : '#0a0b0f',
  band1   : '#0e1016',
  band2   : '#12141c',
  grid    : '#171a23',
  plat    : '#191d27',
  platTop : '#7d8798',
  player  : '#eef1f7',
  enemy   : '#2a2f3d',
  enemyLn : '#8b94a6',
  danger  : '#ff2f6d',
  danger2 : '#ff7ba6',
  orb     : '#4fe3c1',
  dim     : '#5b6373'
};

/* Cada setor tem um clima próprio: o céu, os prédios e — principalmente —
   a cor das luzes das janelas mudam. As cores de jogo (jogador, perigo,
   orbe) NÃO mudam, para que ameaça e recompensa sigam legíveis sempre.   */
const THEME_KEYS = ['sky','hz','b1','b2','b3','edge','win','grid'];
const THEME_DEFS = [
  { name:'STEEL',   sky:'#0a0b0f', hz:'#0f1a26', b1:'#0f1218', b2:'#141821', b3:'#1a1f2a', edge:'#39485c', win:'#8fe6ff', grid:'#161a23' },
  { name:'AMBER',   sky:'#0d0a07', hz:'#2a1608', b1:'#150f09', b2:'#1b1410', b3:'#221a14', edge:'#5c4530', win:'#ffc271', grid:'#211a13' },
  { name:'VIOLET',  sky:'#0a0810', hz:'#1e0f30', b1:'#120f1c', b2:'#171224', b3:'#1d182d', edge:'#4b3a76', win:'#c59cff', grid:'#1b1628' },
  { name:'JADE',    sky:'#070d0b', hz:'#0b2a20', b1:'#0d1614', b2:'#111d19', b3:'#16241f', edge:'#2f5a4a', win:'#7dffc0', grid:'#132019' },
  { name:'CRIMSON', sky:'#0d0709', hz:'#2a0d16', b1:'#170d11', b2:'#1d1116', b3:'#24161b', edge:'#5c2f3c', win:'#ff8f9c', grid:'#211318' },
  { name:'ICE',     sky:'#080a0e', hz:'#122236', b1:'#0e1319', b2:'#131a24', b3:'#18212c', edge:'#365070', win:'#a9c9ff', grid:'#151d28' }
];

function hexToRgb(h){
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const THEMES = THEME_DEFS.map(d => {
  const o = { name: d.name };
  for (const k of THEME_KEYS) o[k] = hexToRgb(d[k]);
  return o;
});
function themeForSector(n){ return THEMES[(Math.max(1, n) - 1) % THEMES.length]; }

/* TH guarda o tema interpolado do quadro atual (strings prontas + rgb). */
const TH = { name:'STEEL' };
let thFrom = THEMES[0], thTo = THEMES[0], thT = 1, thName = THEMES[0].name;

function setTheme(t, instant){
  if (t === thTo && !instant) return;
  if (instant){ thFrom = thTo = t; thT = 1; }
  else {
    // parte da cor atual, mesmo se a transição anterior não terminou
    const snap = { name: t.name };
    for (const k of THEME_KEYS) snap[k] = TH[k + 'Rgb'] ? TH[k + 'Rgb'].slice() : thTo[k].slice();
    thFrom = snap; thTo = t; thT = 0;
  }
  thName = t.name;
}
function updateTheme(dt){
  if (thT < 1) thT = Math.min(1, thT + dt / 1.8);
  const e = thT * thT * (3 - 2 * thT);
  for (const k of THEME_KEYS){
    const a = thFrom[k], b = thTo[k];
    const r = Math.round(lerp(a[0], b[0], e)),
          g = Math.round(lerp(a[1], b[1], e)),
          bl= Math.round(lerp(a[2], b[2], e));
    TH[k + 'Rgb'] = [r, g, bl];
    TH[k] = 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  TH.name = thName;
  bakeGlow();
}
function rgba(rgbArr, a){ return 'rgba(' + rgbArr[0] + ',' + rgbArr[1] + ',' + rgbArr[2] + ',' + a + ')'; }

/* Halo de janela pré-renderizado: desenhar centenas de gradientes por
   quadro seria caro, então tingimos um sprite só quando a cor muda.      */
const glowCv = document.createElement('canvas');
glowCv.width = glowCv.height = 64;
const glowCtx = glowCv.getContext('2d');
let glowKey = '';
function bakeGlow(){
  const key = TH.win;
  if (key === glowKey) return;
  glowKey = key;
  const c = TH.winRgb;
  glowCtx.clearRect(0, 0, 64, 64);
  const g = glowCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0,    rgba(c, 0.85));
  g.addColorStop(0.25, rgba(c, 0.28));
  g.addColorStop(0.6,  rgba(c, 0.07));
  g.addColorStop(1,    rgba(c, 0));
  glowCtx.fillStyle = g;
  glowCtx.fillRect(0, 0, 64, 64);
}

/* Ruído determinístico: o mesmo prédio/janela sempre sai igual, então o
   horizonte não "ferve" enquanto a câmera anda.                          */
function hash(x, y){
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

/* Camadas de paralaxe da cidade (fundo → frente). */
const CITY = [
  { f:0.08, slot:132, hMin:150, hMax:400, col:'b1', lit:0.17, cell:11, alpha:0.48, base:0.90, seed:11, halo:false },
  { f:0.17, slot:186, hMin:200, hMax:540, col:'b2', lit:0.21, cell:13, alpha:0.76, base:0.98, seed:37 },
  { f:0.30, slot:262, hMin:250, hMax:700, col:'b3', lit:0.25, cell:16, alpha:1.00, base:1.06, seed:71 }
];

/* ─────────────────────────────  UTIL  ───────────────────────────── */

const rnd   = (a, b) => a + Math.random() * (b - a);
const rndi  = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const chance= p => Math.random() < p;

/* ─────────────────────────────  ÁUDIO  ───────────────────────────── */

/* Trilha tech lo-fi + efeitos, tudo sintetizado em tempo real (nenhum
   arquivo externo). Um agendador com lookahead dispara os passos de
   semicolcheia; a harmonia e o andamento respondem ao setor atual.      */

const CHORDS = [                       // Am7 · Fmaj7 · Cmaj7 · G7
  { root: 0,  notes:[0, 3, 7, 10] },
  { root:-4,  notes:[-4, 0, 3, 7] },
  { root: 3,  notes:[3, 7, 10, 14] },
  { root:-2,  notes:[-2, 2, 5, 10] }
];
const PENTA = [0, 3, 5, 7, 10, 12, 15];
const SECTOR_KEYS = [0, 3, -2, 5, 2, -4, 7, -5];   // transposição por setor
const VOL_STEPS = [0, 0.28, 0.6, 1];               // níveis do botão de volume

const SND = {
  ctx:null, master:null, comp:null, musicBus:null, musicFilt:null, sfxBus:null,
  delay:null, delayWet:null, noiseBuf:null, hissGain:null,
  on:true, ready:false, playing:false,
  step:0, nextT:0, timer:null, bpm:78, key:0, dense:0,
  vol:3, lastVol:3, musicVol:null,      // volume da música: índice em VOL_STEPS

  init(){
    if (this.ready) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch(e){ return false; }
    const c = this.ctx;

    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -20; this.comp.ratio.value = 6; this.comp.knee.value = 14;
    this.master = c.createGain();
    this.master.gain.value = this.on ? 0.9 : 0;
    this.comp.connect(this.master);
    this.master.connect(c.destination);

    this.musicFilt = c.createBiquadFilter();
    this.musicFilt.type = 'lowpass';
    this.musicFilt.frequency.value = 13000;
    this.musicVol = c.createGain();
    this.musicVol.gain.value = VOL_STEPS[this.vol];
    this.musicVol.connect(this.comp);

    this.musicBus = c.createGain();
    this.musicBus.gain.value = 0.0001;
    this.musicBus.connect(this.musicFilt);
    this.musicFilt.connect(this.musicVol);

    this.sfxBus = c.createGain();
    this.sfxBus.gain.value = 0.9;
    this.sfxBus.connect(this.comp);

    // eco curto (sabor lo-fi) para melodia e detalhes
    this.delay = c.createDelay(1.5);
    this.delay.delayTime.value = 0.36;
    const fb = c.createGain(); fb.gain.value = 0.33;
    const df = c.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 2000;
    this.delayWet = c.createGain(); this.delayWet.gain.value = 0.45;
    this.delay.connect(df); df.connect(fb); fb.connect(this.delay);
    df.connect(this.delayWet); this.delayWet.connect(this.musicBus);

    const len = Math.floor(c.sampleRate * 2);
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    this.ready = true;
    return true;
  },

  /* chamado no primeiro gesto do usuário (exigência de autoplay) */
  arm(){
    if (!this.init()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.startMusic();
  },

  toggle(){                                   // M: silencia tudo
    this.on = !this.on;
    if (!this.ready) { if (this.on) this.arm(); return; }
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(this.on ? 0.9 : 0.0001, t + 0.18);
  },

  setVol(i){                                  // volume só da música
    i = clamp(Math.round(i), 0, VOL_STEPS.length - 1);
    if (i > 0) this.lastVol = i;
    this.vol = i;
    try { localStorage.setItem('vetor_vol', String(i)); } catch(e){}
    if (!this.on) this.toggle();              // mexer no volume reativa o som
    if (!this.ready){ this.arm(); return; }
    const t = this.ctx.currentTime;
    this.musicVol.gain.cancelScheduledValues(t);
    this.musicVol.gain.setValueAtTime(this.musicVol.gain.value, t);
    this.musicVol.gain.linearRampToValueAtTime(Math.max(0.0001, VOL_STEPS[i]), t + 0.15);
  },
  toggleMusic(){ this.setVol(this.vol > 0 ? 0 : this.lastVol || 3); },

  mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); },
  stepDur(){ return 60 / this.bpm / 4; },

  noise(t, dur, gain, type, freq, q, dest){
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.musicBus);
    s.start(t); s.stop(t + dur + 0.05);
    return f;
  },

  /* ── instrumentos ── */
  kick(t, v){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(132, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t + 0.3);
  },
  snare(t, v){
    this.noise(t, 0.16, v, 'bandpass', 1750, 0.7);
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(188, t);
    g.gain.setValueAtTime(v * 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t + 0.13);
  },
  hat(t, v){ this.noise(t, 0.045, v, 'highpass', 7600, 0.8); },
  bass(t, midi, dur){
    const c = this.ctx;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(600, t);
    f.frequency.exponentialRampToValueAtTime(210, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.24, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(this.musicBus);
    for (const [type, det] of [['triangle', 0], ['sawtooth', -7]]){
      const o = c.createOscillator();
      o.type = type; o.frequency.value = this.mtof(midi); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  pad(t, notes, dur){
    const c = this.ctx;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1150; f.Q.value = 0.5;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.052, t + dur * 0.35);
    g.gain.linearRampToValueAtTime(0.040, t + dur * 0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(this.musicBus);
    // oscilação de fita
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 0.55; lg.gain.value = 7;
    lfo.connect(lg); lfo.start(t); lfo.stop(t + dur + 0.1);
    for (const n of notes){
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = this.mtof(n);
      o.detune.value = rnd(-6, 6);
      lg.connect(o.detune);
      o.connect(f); o.start(t); o.stop(t + dur + 0.1);
    }
  },
  lead(t, midi, dur){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(this.mtof(midi), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.musicBus); g.connect(this.delay);
    o.start(t); o.stop(t + dur + 0.05);
  },
  crackle(t){ this.noise(t, 0.03, 0.05, 'bandpass', rnd(1800, 6000), 3); },

  /* ── agendador ── */
  startMusic(){
    if (!this.ready || this.playing) return;
    const c = this.ctx;
    this.playing = true;
    this.step = 0;
    this.nextT = c.currentTime + 0.12;
    this.musicBus.gain.cancelScheduledValues(c.currentTime);
    this.musicBus.gain.setValueAtTime(0.0001, c.currentTime);
    this.musicBus.gain.exponentialRampToValueAtTime(0.9, c.currentTime + 3);
    // chiado de fita contínuo
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1400;
    this.hissGain = c.createGain(); this.hissGain.gain.value = 0.012;
    s.connect(f); f.connect(this.hissGain); this.hissGain.connect(this.musicBus);
    s.start();
    this.timer = setInterval(() => this.tick(), 26);
  },
  tick(){
    if (!this.playing || this.ctx.state === 'suspended') return;
    const now = this.ctx.currentTime;
    if (this.nextT < now) this.nextT = now + 0.02;     // recupera após aba inativa
    while (this.nextT < now + 0.15){
      this.scheduleStep(this.step, this.nextT);
      this.nextT += this.stepDur();
      this.step++;
    }
  },
  scheduleStep(step, t){
    const sd = this.stepDur();
    const s = step % 16, bar = (step >> 4) % 4;
    const T = t + (s % 2 ? sd * 0.16 : 0);            // swing
    const ch = CHORDS[bar], k = this.key;

    if (s === 0 || s === 10 || (s === 7 && bar % 2 === 1)) this.kick(T, 0.7);
    if (s === 4 || s === 12) this.snare(T, 0.2);
    if (s % 2 === 0) this.hat(T, s % 4 === 0 ? 0.05 : 0.03);
    if (this.dense >= 2 && s % 2 === 1 && Math.random() < 0.45) this.hat(T, 0.022);

    if (s === 0 || s === 6 || s === 8 || s === 14) this.bass(T, 45 + k + ch.root, s === 0 ? 0.5 : 0.3);
    if (s === 0) this.pad(t, ch.notes.map(n => n + 57 + k), sd * 16 * 0.96);

    if (this.dense >= 1 && (s === 2 || s === 9 || s === 13) && Math.random() < 0.45)
      this.lead(T, 69 + k + PENTA[rndi(0, PENTA.length - 1)], 0.42);
    if (Math.random() < 0.10) this.crackle(T);
  },

  /* ── reações do jogo ── */
  setSector(n){
    this.key  = SECTOR_KEYS[(n - 1) % SECTOR_KEYS.length];
    this.bpm  = 78 + Math.min(14, (n - 1) * 1.1);
    this.dense = Math.min(3, Math.floor((n - 1) / 2));
  },
  ambience(mode){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const set = (p, v, d) => { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(v, t + d); };
    if (mode === 'dead'){ set(this.musicFilt.frequency, 340, 0.5); set(this.musicBus.gain, 0.45, 0.5); }
    else if (mode === 'pause'){ set(this.musicFilt.frequency, 900, 0.25); set(this.musicBus.gain, 0.35, 0.25); }
    else { set(this.musicFilt.frequency, 13000, 0.5); set(this.musicBus.gain, 0.9, 0.5); }
  },

  /* ── efeitos ── */
  blip(t0, f1, f2, dur, type, vol){
    if (!this.ready) return;
    const c = this.ctx, t = c.currentTime + (t0 || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxBus);
    o.start(t); o.stop(t + dur + 0.03);
  },
  jump(){
    if (!this.ready) return;
    this.blip(0, 300, 640, 0.13, 'triangle', 0.13);
    this.noise(this.ctx.currentTime, 0.07, 0.035, 'highpass', 2600, 1, this.sfxBus);
  },
  djump(){
    if (!this.ready) return;
    this.blip(0, 520, 1080, 0.16, 'triangle', 0.11);
    this.blip(0.03, 780, 1560, 0.14, 'sine', 0.07);
    this.noise(this.ctx.currentTime, 0.22, 0.045, 'highpass', 5200, 1, this.sfxBus);
  },
  hit(){
    if (!this.ready) return;
    const c = this.ctx, t = c.currentTime;
    const f = this.noise(t, 0.3, 0.28, 'bandpass', 1200, 1.4, this.sfxBus);
    f.frequency.setValueAtTime(1400, t);
    f.frequency.exponentialRampToValueAtTime(180, t + 0.3);
    this.blip(0, 260, 55, 0.32, 'square', 0.16);
  },
  death(){
    if (!this.ready) return;
    const c = this.ctx, t = c.currentTime;
    this.blip(0, 440, 42, 1.3, 'sawtooth', 0.16);
    this.blip(0.04, 330, 38, 1.2, 'square', 0.08);
    const f = this.noise(t, 1.1, 0.16, 'lowpass', 3000, 1, this.sfxBus);
    f.frequency.setValueAtTime(3000, t);
    f.frequency.exponentialRampToValueAtTime(160, t + 1.1);
    this.ambience('dead');
  },
  orb(combo){
    this.blip(0, 900 + Math.min(combo, 7) * 120, 1500 + Math.min(combo, 7) * 160, 0.09, 'triangle', 0.055);
  },
  stomp(){
    if (!this.ready) return;
    this.blip(0, 820, 260, 0.11, 'square', 0.09);
    this.noise(this.ctx.currentTime, 0.12, 0.09, 'bandpass', 900, 1.2, this.sfxBus);
  },
  shot(kind){ this.blip(0, kind === 'seeker' ? 200 : 300, kind === 'seeker' ? 120 : 180, 0.09, 'sawtooth', 0.035); },
  bomb(){ this.blip(0, 190, 110, 0.1, 'triangle', 0.035); },
  boom(){
    if (!this.ready) return;
    this.blip(0, 220, 40, 0.34, 'sawtooth', 0.09);
    this.noise(this.ctx.currentTime, 0.34, 0.1, 'lowpass', 1400, 1, this.sfxBus);
  },
  start(){
    if (!this.ready) return;
    this.ambience('play');
    [0, 0.07, 0.14].forEach((d, i) => this.blip(d, 440 * Math.pow(2, i / 3), 660 * Math.pow(2, i / 3), 0.12, 'triangle', 0.07));
  },
  sector(){
    if (!this.ready) return;
    const c = this.ctx, t = c.currentTime;
    const f = this.noise(t, 0.9, 0.10, 'bandpass', 400, 3, this.sfxBus);
    f.frequency.setValueAtTime(400, t);
    f.frequency.exponentialRampToValueAtTime(5200, t + 0.75);
    [0, 4, 7, 11].forEach((n, i) => this.blip(0.55 + i * 0.045, this.mtof(81 + this.key + n), this.mtof(81 + this.key + n), 0.7, 'sine', 0.075));
  }
};
try {
  const v = parseInt(localStorage.getItem('vetor_vol'), 10);
  if (!isNaN(v)) { SND.vol = Math.min(Math.max(v, 0), VOL_STEPS.length - 1); if (v > 0) SND.lastVol = SND.vol; }
} catch(e){}

/* ── Botão de volume da música (canto inferior esquerdo, clicável) ── */
const volUI = { sp:null, bars:[], hover:null };

function layoutVolUI(){
  const x = 22, base = H - 26;
  volUI.sp = { x, y: base - 16, w: 15, h: 16, act:-1 };
  volUI.bars.length = 0;
  for (let i = 0; i < VOL_STEPS.length - 1; i++){
    const h = 6 + i * 4;
    volUI.bars.push({ x: x + 25 + i * 13, y: base - h, w: 9, h, act: i + 1 });
  }
}
function volHit(mx, my){
  layoutVolUI();
  const sp = volUI.sp;
  if (mx >= sp.x - 8 && mx <= sp.x + sp.w + 6 && my >= sp.y - 10 && my <= sp.y + sp.h + 10) return -1;
  /* A fila de barras vira uma faixa contínua: com áreas por barra elas se
     sobrepunham e um clique na 3ª caía na 2ª.                             */
  const bs = volUI.bars, last = bs[bs.length - 1];
  const x0 = bs[0].x - 4, x1 = last.x + last.w + 8;
  const yTop = last.y - 10, yBot = bs[0].y + bs[0].h + 10;
  if (mx >= x0 && mx <= x1 && my >= yTop && my <= yBot){
    const i = clamp(Math.floor((mx - x0) / ((x1 - x0) / bs.length)), 0, bs.length - 1);
    return bs[i].act;
  }
  return null;
}
function volClick(mx, my){
  const a = volHit(mx, my);
  if (a === null) return false;
  if (a === -1) SND.toggleMusic(); else SND.setVol(a);
  SND.blip(0, 560, 820, 0.06, 'triangle', 0.05);
  return true;
}
function drawVolumeUI(){
  layoutVolUI();
  const muted = !SND.on || SND.vol === 0;
  const sp = volUI.sp;
  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = COL.dim;
  ctx.globalAlpha = 0.55;
  ctx.font = '500 9px ui-monospace, monospace';
  ctx.letterSpacing = '2px';
  ctx.fillText('MUSIC', 22, H - 48);
  ctx.letterSpacing = '0px';

  // alto-falante
  ctx.globalAlpha = volUI.hover === -1 ? 1 : 0.8;
  ctx.fillStyle = muted ? COL.danger : COL.player;
  ctx.fillRect(sp.x, sp.y + 5, 4, 6);
  ctx.beginPath();
  ctx.moveTo(sp.x + 4, sp.y + 8);
  ctx.lineTo(sp.x + 10, sp.y + 1);
  ctx.lineTo(sp.x + 10, sp.y + 15);
  ctx.closePath();
  ctx.fill();
  if (muted){
    ctx.strokeStyle = COL.danger;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sp.x + 12, sp.y + 4); ctx.lineTo(sp.x + 18, sp.y + 12);
    ctx.moveTo(sp.x + 18, sp.y + 4); ctx.lineTo(sp.x + 12, sp.y + 12);
    ctx.stroke();
  } else {
    ctx.strokeStyle = COL.player;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(sp.x + 11, sp.y + 8, 4.5, -0.9, 0.9); ctx.stroke();
  }

  // barras de nível
  for (const b of volUI.bars){
    const active = !muted && SND.vol >= b.act;
    ctx.globalAlpha = volUI.hover === b.act ? 1 : (active ? 0.9 : 0.42);
    if (active){
      ctx.fillStyle = TH.win;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    } else {
      ctx.strokeStyle = COL.dim;
      ctx.lineWidth = 1;
      ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    }
  }

  ctx.globalAlpha = 0.45;
  ctx.fillStyle = !SND.on ? COL.danger : COL.dim;
  ctx.font = '500 9px ui-monospace, monospace';
  ctx.fillText(SND.on ? 'M MUTE ALL' : 'M ALL MUTED', 22 + 25 + 3 * 13 + 16, H - 26);
  ctx.restore();
}

/* ─────────────────────────────  ENTRADA  ───────────────────────────── */

const keys = Object.create(null);
let jumpBuffer = 0, jumpHeld = false;

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k)) e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  SND.arm();                                   // áudio só pode iniciar após um gesto
  if (k === ' ' || k === 'w' || k === 'arrowup'){ jumpBuffer = 0.12; jumpHeld = true; }
  if (k === 'r') restart();
  if (k === 'm') SND.toggle();
  if (k === 'p' || k === 'escape') togglePause();
  if (state === 'menu' && (k === ' ' || k === 'enter')) startRun();
  if (state === 'dead' && (k === ' ' || k === 'enter')) restart();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === ' ' || k === 'w' || k === 'arrowup') jumpHeld = false;
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; jumpHeld = false; });

/* Toque: metade esquerda inferior = mover, lado direito = pular */
let touchLeft = false, touchRight = false;
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const touchState = new Map();
function handleTouches(e){
  isTouch = true;
  e.preventDefault();
  SND.arm();
  touchLeft = touchRight = false;
  let wantJump = false, onUI = false;
  for (const t of e.touches){
    if (volHit(t.clientX, t.clientY) !== null){        // toque no botão de volume
      onUI = true;
      if (e.type === 'touchstart') volClick(t.clientX, t.clientY);
      continue;
    }
    if (t.clientX > W * 0.55) wantJump = true;
    else if (t.clientX < W * 0.22) touchLeft = true;
    else touchRight = true;
  }
  if (wantJump && !jumpHeld){ jumpBuffer = 0.12; }
  jumpHeld = wantJump;
  if (onUI || !e.touches.length) return;
  if (state === 'menu') startRun();
  else if (state === 'dead' && deadTime > 0.6) restart();
}
canvas.addEventListener('touchstart', handleTouches, {passive:false});
canvas.addEventListener('touchmove',  handleTouches, {passive:false});
canvas.addEventListener('touchend',   handleTouches, {passive:false});
canvas.addEventListener('touchcancel',handleTouches, {passive:false});
canvas.addEventListener('mousedown', e => {
  SND.arm();
  if (volClick(e.clientX, e.clientY)) return;          // clique no botão de volume
  if (state === 'menu') startRun();
  else if (state === 'dead' && deadTime > 0.6) restart();
});
canvas.addEventListener('mousemove', e => {
  volUI.hover = volHit(e.clientX, e.clientY);
  canvas.style.cursor = volUI.hover === null ? 'default' : 'pointer';
});
canvas.addEventListener('mouseleave', () => { volUI.hover = null; });

/* ─────────────────────────────  FÍSICA  ───────────────────────────── */

const GRAV      = 2400;
const MAX_FALL  = 1250;
const RUN_SPEED = 348;
const ACCEL     = 3400;
const AIR_ACCEL = 2200;
const FRICTION  = 2900;
const JUMP_V    = 790;
const DJUMP_V   = 690;
const COYOTE    = 0.10;
/* As plataformas vivem na faixa y ∈ [180, 620]; abaixo disso é o vazio.
   A câmera acompanha a queda, então o limite precisa ser absoluto.      */
const DEATH_Y   = 1180;

/* ─────────────────────────────  ESTADO  ───────────────────────────── */

let state = 'menu';            // menu | playing | dead | paused
let time = 0, deadTime = 0;

const player = {
  x:0, y:0, w:20, h:28, vx:0, vy:0,
  grounded:false, coyote:0, jumps:0, maxJumps:2,
  hp:3, maxHp:3, inv:0, face:1, squash:0, ridingPlat:null, dead:false
};

let platforms = [], enemies = [], shots = [], orbs = [], parts = [], rings = [], pops = [];
let cursorX = 0, lastY = 0, segCount = 0;
let cam = { x:0, y:0, sx:0, sy:0, shake:0 };
let score = 0, distance = 0, maxX = 0, combo = 1, comboTimer = 0;
let curSector = 1, sectorFx = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('vetor_best') || '0', 10) || 0; } catch(e){ best = 0; }

/* Dificuldade contínua: cresce com a distância, sem teto rígido. */
function difficultyAt(x){ return Math.log(1 + Math.max(0, x) / 1400) * 1.35; }
function sectorAt(x){ return 1 + Math.floor(Math.max(0, x) / 2600); }

/* ─────────────────────────────  MUNDO  ───────────────────────────── */

function addPlatform(x, y, w, h, opts){
  const p = Object.assign({
    x, y, w, h, x0:x, y0:y, px:x, py:y,
    move:null, amp:0, spd:0, phase:0
  }, opts || {});
  platforms.push(p);
  return p;
}

function spawnEnemy(type, x, y, plat){
  enemies.push({
    type, x, y, w: type==='drone' ? 26 : 24, h: type==='drone' ? 20 : 24,
    vx:0, vy:0, t: rnd(0,3), cd: rnd(0.6,1.8), charge:0, dead:false,
    plat: plat||null, dir: chance(0.5)?-1:1, baseY:y, hp: type==='turret'?1:1, flash:0
  });
}

function spawnOrb(x, y){ orbs.push({ x, y, t: rnd(0,6.28), taken:false }); }

/* Gera um segmento: plataforma + vão seguinte + conteúdo. */
function genSegment(){
  const d = difficultyAt(cursorX);

  let gap = 0;
  if (segCount > 0){
    gap = clamp(rnd(78, 120 + d * 26), 78, 252);
    if (segCount > 4 && chance(0.10 + d * 0.02)) gap = clamp(gap * 1.25, 78, 268); // vão largo ocasional
  }
  cursorX += gap;

  const spread = 60 + d * 16;
  let dy = rnd(-spread, spread * 0.85);
  let y = clamp(lastY + dy, 180, 620);

  let w = clamp(rnd(150, 330) - d * 16, 92, 340);
  if (segCount < 3){ w = 420; y = 460; }

  const px = cursorX;
  const plat = addPlatform(px, y, w, 300);

  // Plataformas móveis a partir de certa dificuldade
  if (d > 0.9 && segCount > 6 && chance(clamp(0.08 + d * 0.05, 0, 0.30))){
    plat.move  = chance(0.55) ? 'y' : 'x';
    plat.amp   = plat.move === 'y' ? rnd(40, 40 + d * 26) : rnd(30, 30 + d * 30);
    plat.spd   = rnd(0.7, 0.9 + d * 0.25);
    plat.phase = rnd(0, Math.PI * 2);
    plat.h = 18;
    plat.w = Math.min(plat.w, 190);
  }

  cursorX += plat.w;
  lastY = y;

  if (segCount > 3){
    // Inimigos
    const enemyChance = clamp(0.30 + d * 0.20, 0, 0.88);
    if (chance(enemyChance) && plat.w > 110){
      const roll = Math.random();
      const tx = px + rnd(40, plat.w - 40);
      if (roll < clamp(0.42 - d * 0.05, 0.18, 0.42)) spawnEnemy('walker', tx, y - 24, plat);
      else if (roll < 0.80) spawnEnemy('turret', tx, y - 24, plat);
      else spawnEnemy('drone', tx, y - rnd(110, 190), null);
    }
    // Segundo inimigo em plataformas longas e setores avançados
    if (d > 1.5 && plat.w > 240 && chance(clamp((d - 1.5) * 0.35, 0, 0.55))){
      const tx = px + rnd(40, plat.w - 40);
      spawnEnemy(chance(0.5) ? 'turret' : 'drone', tx, y - (chance(0.5) ? 24 : rnd(120, 200)), chance(0.5) ? plat : null);
    }
    // Drone patrulhando o vão
    if (gap > 170 && chance(0.25 + d * 0.06)) spawnEnemy('drone', px - gap * 0.5, y - rnd(90, 170), null);
  }

  // Coletáveis: arco sobre o vão ou linha sobre a plataforma
  if (gap > 90 && chance(0.75)){
    const n = 5, x0 = px - gap, apex = Math.min(y, lastY) - rnd(70, 120);
    for (let i = 0; i < n; i++){
      const t = i / (n - 1);
      spawnOrb(x0 + gap * t, lerp(y, apex, Math.sin(t * Math.PI)));
    }
  } else if (chance(0.45)){
    const n = rndi(2, 4);
    for (let i = 0; i < n; i++) spawnOrb(px + 40 + i * 42, y - rnd(52, 96));
  }

  // Plataforma flutuante extra
  if (chance(0.30) && segCount > 4){
    const fx = px + rnd(20, Math.max(30, plat.w - 90));
    const fy = y - rnd(120, 190);
    if (fy > 140){
      addPlatform(fx, fy, rnd(70, 130), 16);
      if (chance(0.5)) spawnOrb(fx + 40, fy - 40);
    }
  }

  segCount++;
}

function ensureWorld(){
  while (cursorX < cam.x + W * 2.2) genSegment();
}

function cullWorld(){
  const lim = cam.x - W * 0.9;
  platforms = platforms.filter(p => p.x + p.w > lim);
  enemies   = enemies.filter(e => e.x > lim && !e.dead);
  orbs      = orbs.filter(o => o.x > lim && !o.taken);
  shots     = shots.filter(s => s.x > lim - 200 && s.life > 0);
}

/* ─────────────────────────────  PARTÍCULAS  ───────────────────────────── */

function burst(x, y, n, color, spd, glow, size){
  for (let i = 0; i < n; i++){
    const a = rnd(0, Math.PI * 2), s = rnd(spd * 0.3, spd);
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rnd(0.25, 0.7), max: 0.7, color,
      size: size || rnd(1.6, 3.4), glow: !!glow, grav: glow ? 120 : 620
    });
  }
}
function popText(x, y, text, color){
  pops.push({ x, y, text, color, life: 0.9 });
}

/* ─────────────────────────────  CICLO DE VIDA  ───────────────────────────── */

function resetWorld(){
  platforms = []; enemies = []; shots = []; orbs = []; parts = []; rings = []; pops = [];
  cursorX = 0; lastY = 460; segCount = 0;
  score = 0; distance = 0; maxX = 0; combo = 1; comboTimer = 0;
  player.x = 120; player.y = 380; player.vx = 0; player.vy = 0;
  player.hp = player.maxHp; player.inv = 0; player.jumps = 0;
  player.grounded = false; player.coyote = 0; player.squash = 0; player.dead = false;
  cam.x = player.x - W * 0.34; cam.y = player.y - H * 0.55;
  cam.sx = cam.x; cam.sy = cam.y; cam.shake = 0;
  curSector = 1; sectorFx = 0;
  setTheme(themeForSector(1), true);
  updateTheme(0);
  SND.setSector(1);
  ensureWorld();
}

/* Virada de setor: novo clima de cor, varredura luminosa e mudança de
   tonalidade/andamento na trilha.                                        */
function onSectorChange(n){
  curSector = n;
  sectorFx = 1;
  setTheme(themeForSector(n), false);
  SND.setSector(n);
  SND.sector();
  cam.shake = Math.max(cam.shake, 5);
  ringFx(player.x + player.w/2, player.y + player.h/2, 190, COL.player, 0.7, false);
  popText(player.x + player.w/2, player.y - 26, 'SECTOR ' + n, COL.orb);
}
function startRun(){ resetWorld(); state = 'playing'; time = 0; SND.start(); }
function restart(){ startRun(); }
function togglePause(){
  if (state === 'playing'){ state = 'paused'; SND.ambience('pause'); }
  else if (state === 'paused'){ state = 'playing'; SND.ambience('play'); }
}
function killPlayer(reason){
  if (player.dead) return;
  player.dead = true;
  state = 'dead'; deadTime = 0;
  cam.shake = 22;
  burst(player.x + player.w/2, player.y + player.h/2, 40, COL.player, 520, false);
  burst(player.x + player.w/2, player.y + player.h/2, 26, COL.danger, 420, true, 3.5);
  SND.death();
  if (score > best){
    best = Math.floor(score);
    try { localStorage.setItem('vetor_best', String(best)); } catch(e){}
  }
}
function hurtPlayer(sx, sy){
  if (player.inv > 0 || player.dead) return;
  player.hp--;
  player.inv = 1.25;
  combo = 1; comboTimer = 0;
  const dir = Math.sign((player.x + player.w/2) - sx) || 1;
  player.vx = dir * 320;
  player.vy = -330;
  cam.shake = 14;
  burst(player.x + player.w/2, player.y + player.h/2, 18, COL.danger, 340, true, 3);
  SND.hit();
  if (player.hp <= 0) killPlayer('hp');
}

/* ─────────────────────────────  ATUALIZAÇÃO  ───────────────────────────── */

function updatePlatforms(dt){
  for (const p of platforms){
    p.px = p.x; p.py = p.y;
    if (p.move){
      const o = Math.sin(time * p.spd + p.phase) * p.amp;
      if (p.move === 'x') p.x = p.x0 + o; else p.y = p.y0 + o;
    }
  }
}

function collide(dt){
  const riding = player.ridingPlat;
  player.grounded = false;
  player.ridingPlat = null;

  /* A carona vem ANTES de resolver colisão. Aplicá-la depois deixava o
     jogador alguns pixels dentro da plataforma; no quadro seguinte o eixo
     X via essa sobreposição e o ejetava para a borda (p.x - largura), que
     é o "sumir e reaparecer fora" das plataformas móveis.                */
  if (riding && riding.move){
    player.x += riding.x - riding.px;
    player.y += riding.y - riding.py;
  }

  const prevBottom = player.y + player.h;

  // ── eixo X ──
  player.x += player.vx * dt;
  for (const p of platforms){
    if (!aabb(player, p)) continue;
    // De pé no topo (sobreposição vertical mínima): quem resolve é o eixo Y.
    const ovY = Math.min(player.y + player.h, p.y + p.h) - Math.max(player.y, p.y);
    if (ovY <= 10 && prevBottom <= p.y + 10) continue;
    const cx = player.x + player.w / 2;
    if (player.vx > 0 || (player.vx === 0 && cx < p.x + p.w / 2)) player.x = p.x - player.w;
    else player.x = p.x + p.w;
    player.vx = 0;
  }

  // ── eixo Y ──
  player.y += player.vy * dt;
  for (const p of platforms){
    if (!aabb(player, p)) continue;
    const fromTop = (player.y + player.h) - p.y;      // profundidade pelo topo
    const fromBot = (p.y + p.h) - player.y;           // profundidade por baixo
    /* Sai pelo lado vertical mais próximo. Empurrar sempre para baixo
       assumia plataforma fina e jogava o jogador 300 px abaixo (para o
       vazio) quando a cabeça entrava perto do topo de uma alta.          */
    const land = player.vy >= 0 ? (prevBottom <= p.y + 10 || fromTop <= fromBot)
                                : fromTop < fromBot;
    if (land){
      if (player.vy > 620){
        player.squash = Math.min(1, player.vy / 1100);
        burst(player.x + player.w/2, p.y, 6, COL.dim, 120);
      }
      player.y = p.y - player.h;
      if (player.vy > 0) player.vy = 0;
      player.grounded = true;
      player.ridingPlat = p;
    } else {
      player.y = p.y + p.h;
      if (player.vy < 0) player.vy = 60;
    }
  }
}

function aabb(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* Contato com inimigo usa caixa encolhida: as formas são triângulo e
   losango, então os cantos do AABB são visualmente vazios e machucavam
   sem encostar.                                                          */
function overlapInset(a, b, aix, aiy, bix, biy){
  return a.x + aix < b.x + b.w - bix && a.x + a.w - aix > b.x + bix &&
         a.y + aiy < b.y + b.h - biy && a.y + a.h - aiy > b.y + biy;
}

/* Linha livre de cenário: a onda de choque não atravessa plataforma. */
function lineClear(x0, y0, x1, y1){
  for (let i = 1; i <= 6; i++){
    const t = i / 7;
    const x = lerp(x0, x1, t), y = lerp(y0, y1, t);
    for (const p of platforms){
      if (x > p.x && x < p.x + p.w && y > p.y && y < p.y + p.h) return false;
    }
  }
  return true;
}

function updatePlayer(dt){
  const left  = keys['a'] || keys['arrowleft']  || touchLeft;
  const right = keys['d'] || keys['arrowright'] || touchRight;
  const dir = (right ? 1 : 0) - (left ? 1 : 0);
  const acc = player.grounded ? ACCEL : AIR_ACCEL;

  if (dir !== 0){
    player.vx += dir * acc * dt;
    player.vx = clamp(player.vx, -RUN_SPEED, RUN_SPEED);
    player.face = dir;
  } else if (player.grounded){
    const f = FRICTION * dt;
    player.vx = Math.abs(player.vx) <= f ? 0 : player.vx - Math.sign(player.vx) * f;
  } else {
    player.vx *= (1 - 0.9 * dt);
  }

  player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL);

  if (player.grounded){ player.coyote = COYOTE; player.jumps = player.maxJumps; }
  else player.coyote = Math.max(0, player.coyote - dt);

  jumpBuffer = Math.max(0, jumpBuffer - dt);
  if (jumpBuffer > 0){
    if (player.coyote > 0){
      player.vy = -JUMP_V; player.coyote = 0; player.jumps = player.maxJumps - 1;
      jumpBuffer = 0; player.squash = -0.8;
      burst(player.x + player.w/2, player.y + player.h, 8, COL.dim, 160);
      SND.jump();
    } else if (player.jumps > 0){
      player.vy = -DJUMP_V; player.jumps--;
      jumpBuffer = 0; player.squash = -0.7;
      ringFx(player.x + player.w/2, player.y + player.h, 34, COL.player, 0.28, false);
      SND.djump();
    }
  }
  if (!jumpHeld && player.vy < -180) player.vy += 2400 * dt; // pulo variável

  collide(dt);

  player.squash = lerp(player.squash, 0, dt * 9);
  player.inv = Math.max(0, player.inv - dt);

  maxX = Math.max(maxX, player.x);
  distance = maxX;

  comboTimer = Math.max(0, comboTimer - dt);
  if (comboTimer === 0 && combo > 1) combo = 1;

  // Queda no vazio
  if (player.y > DEATH_Y) killPlayer('fall');
}

function ringFx(x, y, r, color, life, deadly){
  rings.push({ x, y, r:8, maxR:r, life, max:life, color, deadly:!!deadly, hit:false });
}

function fireShot(x, y, tx, ty, speed, kind){
  const a = Math.atan2(ty - y, tx - x);
  shots.push({
    x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
    r: kind === 'seeker' ? 7 : 6, life: kind === 'seeker' ? 5.5 : 4,
    kind: kind || 'bolt', t: 0
  });
  SND.shot(kind);
}

function updateEnemies(dt){
  const d = difficultyAt(player.x);
  const pcx = player.x + player.w/2, pcy = player.y + player.h/2;

  for (const e of enemies){
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    const visible = e.x > cam.x - 120 && e.x < cam.x + W + 220;
    const ecx = e.x + e.w/2, ecy = e.y + e.h/2;
    const distToPlayer = Math.hypot(pcx - ecx, pcy - ecy);

    if (e.type === 'walker'){
      const spd = 58 + d * 26;
      e.x += e.dir * spd * dt;
      if (e.plat){
        e.y = e.plat.y - e.h;
        if (e.x < e.plat.x + 4){ e.x = e.plat.x + 4; e.dir = 1; }
        if (e.x + e.w > e.plat.x + e.plat.w - 4){ e.x = e.plat.x + e.plat.w - e.w - 4; e.dir = -1; }
      }
    } else if (e.type === 'turret'){
      if (e.plat) e.y = e.plat.y - e.h;
      if (visible && distToPlayer < 620){
        e.cd -= dt;
        if (e.cd <= 0.42 && e.charge === 0) e.charge = 0.42;
        if (e.charge > 0){
          e.charge -= dt;
          if (e.charge <= 0){
            const spd = 300 + d * 62;
            fireShot(ecx, ecy, pcx, pcy, spd, chance(clamp(d * 0.14, 0, 0.35)) ? 'seeker' : 'bolt');
            e.cd = clamp(1.75 - d * 0.22, 0.55, 1.9) * rnd(0.85, 1.15);
            e.charge = 0;
            burst(ecx, ecy, 6, COL.danger, 160, true, 2.4);
          }
        }
      }
    } else if (e.type === 'drone'){
      const spd = 46 + d * 18;
      e.y = e.baseY + Math.sin(e.t * 1.7) * 26;
      e.x += Math.cos(e.t * 0.8) * spd * dt;
      // persegue horizontalmente de leve
      e.x += clamp(pcx - ecx, -1, 1) * (18 + d * 12) * dt;
      if (visible && distToPlayer < 520){
        e.cd -= dt;
        if (e.cd <= 0){
          e.cd = clamp(2.4 - d * 0.26, 0.9, 2.6) * rnd(0.85, 1.2);
          shots.push({ x: ecx, y: ecy + 12, vx: rnd(-30,30), vy: 40, r:7, life:4, kind:'bomb', t:0 });
          SND.bomb();
        }
      }
    }

    // Colisão com o jogador: pisão vs dano
    // recuo maior na horizontal (cantos vazios) e mínimo na vertical (pisão responsivo)
    if (!player.dead && overlapInset(player, e, 3, 2, 5, 2)){
      const stomp = player.vy > 20 && (player.y + player.h) - e.y < 26;
      if (stomp){
        e.dead = true;
        player.vy = -560;
        player.jumps = Math.max(player.jumps, 1);
        cam.shake = Math.max(cam.shake, 7);
        combo = Math.min(combo + 1, 9);
        comboTimer = 3.2;
        const pts = 60 * combo;
        score += pts;
        popText(ecx, ecy - 14, '+' + pts, COL.player);
        burst(ecx, ecy, 16, COL.enemyLn, 300, false);
        burst(ecx, ecy, 10, COL.danger, 240, true, 3);
        ringFx(ecx, ecy, 42, COL.danger, 0.3, false);
        SND.stomp();
      } else {
        hurtPlayer(ecx, ecy);
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateShots(dt){
  const pcx = player.x + player.w/2, pcy = player.y + player.h/2;
  for (const s of shots){
    s.t += dt;
    s.life -= dt;

    if (s.kind === 'seeker'){
      const a = Math.atan2(pcy - s.y, pcx - s.x);
      const cur = Math.atan2(s.vy, s.vx);
      let da = a - cur;
      while (da >  Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      const na = cur + clamp(da, -1.6 * dt, 1.6 * dt);
      const sp = Math.hypot(s.vx, s.vy);
      s.vx = Math.cos(na) * sp; s.vy = Math.sin(na) * sp;
    } else if (s.kind === 'bomb'){
      s.vy = Math.min(s.vy + 900 * dt, 620);
    }

    const px0 = s.x, py0 = s.y;      // último ponto livre, antes de entrar no cenário
    s.x += s.vx * dt;
    s.y += s.vy * dt;

    // rastro luminoso
    if (Math.random() < 0.9){
      parts.push({
        x: s.x, y: s.y, vx: rnd(-16,16), vy: rnd(-16,16),
        life: 0.3, max: 0.3, color: COL.danger, size: s.r * 0.7, glow:true, grav:0
      });
    }

    // colisão com o cenário
    let hitPlat = false;
    for (const p of platforms){
      if (s.x > p.x && s.x < p.x + p.w && s.y > p.y && s.y < p.y + p.h){ hitPlat = true; break; }
    }
    if (hitPlat || s.life <= 0){
      s.life = 0;
      if (s.kind === 'bomb'){
        // centro fora da plataforma, senão a própria parede bloquearia a onda
        ringFx(px0, py0, 78, COL.danger, 0.42, true);
        burst(px0, py0, 18, COL.danger, 320, true, 3.2);
        cam.shake = Math.max(cam.shake, 6);
        SND.boom();
      } else {
        burst(s.x, s.y, 8, COL.danger, 180, true, 2.4);
      }
      continue;
    }

    // acerto no jogador
    if (!player.dead && player.inv <= 0){
      const dx = clamp(s.x, player.x, player.x + player.w) - s.x;
      const dy = clamp(s.y, player.y, player.y + player.h) - s.y;
      if (dx*dx + dy*dy < s.r * s.r){
        s.life = 0;
        burst(s.x, s.y, 16, COL.danger, 300, true, 3);
        if (s.kind === 'bomb') ringFx(s.x, s.y, 70, COL.danger, 0.4, false);
        hurtPlayer(s.x, s.y);
      }
    }
  }
  shots = shots.filter(s => s.life > 0);
}

function updateRings(dt){
  for (const r of rings){
    r.life -= dt;
    const t = 1 - r.life / r.max;
    r.r = lerp(8, r.maxR, 1 - Math.pow(1 - t, 2));
    if (r.deadly && !r.hit && !player.dead && player.inv <= 0){
      const cx = player.x + player.w/2, cy = player.y + player.h/2;
      if (Math.hypot(cx - r.x, cy - r.y) < r.r && lineClear(r.x, r.y, cx, cy)){
        r.hit = true; hurtPlayer(r.x, r.y);
      }
    }
  }
  rings = rings.filter(r => r.life > 0);
}

function updateOrbs(dt){
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  for (const o of orbs){
    o.t += dt;
    const dx = cx - o.x, dy = cy - o.y;
    const dd = dx*dx + dy*dy;
    if (dd < 68*68){ o.x += dx * 5 * dt; o.y += dy * 5 * dt; }   // ímã suave
    if (dd < 22*22 && !o.taken){
      o.taken = true;
      const pts = 25 * combo;
      score += pts;
      comboTimer = Math.max(comboTimer, 1.6);
      burst(o.x, o.y, 10, COL.orb, 200, true, 2.4);
      SND.orb(combo);
    }
  }
  orbs = orbs.filter(o => !o.taken);
}

function updateParts(dt){
  for (const p of parts){
    p.life -= dt;
    p.vy += p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops){ p.life -= dt; p.y -= 34 * dt; }
  pops = pops.filter(p => p.life > 0);
}

function updateCamera(dt){
  const targetX = player.x - W * 0.34;
  const targetY = player.y - H * 0.55;
  cam.x = lerp(cam.x, Math.max(cam.x, targetX), 1 - Math.pow(0.001, dt));
  cam.y = lerp(cam.y, targetY, 1 - Math.pow(0.0025, dt));
  cam.shake = Math.max(0, cam.shake - dt * 42);
  cam.sx = cam.x + (Math.random() * 2 - 1) * cam.shake;
  cam.sy = cam.y + (Math.random() * 2 - 1) * cam.shake;
}

function update(dt){
  time += dt;
  if (state === 'playing'){
    updatePlatforms(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateShots(dt);
    updateRings(dt);
    updateOrbs(dt);
    score += (player.vx > 0 ? player.vx : 0) * dt * 0.08;   // pontos por avanço
    const sec = sectorAt(distance);
    if (sec !== curSector) onSectorChange(sec);
    ensureWorld();
    cullWorld();
  } else if (state === 'dead'){
    deadTime += dt;
    updatePlatforms(dt);
    updateShots(dt);
    updateRings(dt);
  }
  updateParts(dt);
  updateTheme(dt);
  sectorFx = Math.max(0, sectorFx - dt / 1.5);
  if (state !== 'paused') updateCamera(dt);
}

/* ─────────────────────────────  DESENHO  ───────────────────────────── */

function drawBackground(){
  ctx.fillStyle = TH.sky;
  ctx.fillRect(0, 0, W, H);

  // brilho difuso da cidade subindo do horizonte
  const horizon = H * 0.92 - cam.sy * 0.06;
  const hg = ctx.createLinearGradient(0, horizon - H * 0.85, 0, horizon);
  hg.addColorStop(0, rgba(TH.hzRgb, 0));
  hg.addColorStop(0.65, rgba(TH.hzRgb, 0.35));
  hg.addColorStop(1, rgba(TH.hzRgb, 0.75));
  ctx.fillStyle = hg;
  ctx.fillRect(0, Math.max(0, horizon - H * 0.85), W, H);

  // grade discreta
  ctx.strokeStyle = TH.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  const gs = 92;
  const gx = -(cam.sx * 0.5) % gs, gy = -(cam.sy * 0.5) % gs;
  for (let x = gx; x < W; x += gs){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = gy; y < H; y += gs){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  for (const L of CITY) drawCityLayer(L);

  // névoa baixa: separa a cidade do plano de jogo
  const fg = ctx.createLinearGradient(0, H * 0.48, 0, H);
  fg.addColorStop(0, rgba(TH.skyRgb, 0));
  fg.addColorStop(0.55, rgba(TH.skyRgb, 0.45));
  fg.addColorStop(1, rgba(TH.skyRgb, 0.78));
  ctx.fillStyle = fg;
  ctx.fillRect(0, H * 0.48, W, H * 0.52);
}

function drawCityLayer(L){
  const ox = cam.sx * L.f;
  const baseY = H * L.base - cam.sy * L.f * 0.55;
  const i0 = Math.floor((ox - L.slot) / L.slot);
  const i1 = Math.ceil((ox + W + L.slot) / L.slot);
  const twk = time * 1.6;

  // 1ª passada: volumes
  ctx.fillStyle = TH[L.col];
  const built = [];
  for (let i = i0; i <= i1; i++){
    const r0 = hash(i, L.seed), r1 = hash(i, L.seed + 1), r2 = hash(i, L.seed + 2);
    if (r0 > 0.94) continue;                                  // lacuna ocasional no skyline
    const bw = Math.round(L.slot * (0.48 + r1 * 0.40));
    const bx = Math.round(i * L.slot + (L.slot - bw) * r0 - ox);
    if (bx > W + 4 || bx + bw < -4) continue;
    const by = Math.round(baseY - (L.hMin + r2 * (L.hMax - L.hMin)));
    if (by > H) continue;
    ctx.fillRect(bx, by, bw, H - by + 40);
    built.push([i, bx, by, bw, r1]);
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // 2ª passada: topo dos prédios e antenas de sinalização
  ctx.fillStyle = TH.edge;
  ctx.globalAlpha = L.alpha * 0.5;
  for (const b of built){
    ctx.fillRect(b[1], b[2], b[3], 1);
    if (b[4] > 0.78 && b[2] > 30) ctx.fillRect(Math.round(b[1] + b[3] * 0.5), b[2] - (10 + b[4] * 16), 1, 10 + b[4] * 16);
  }
  ctx.fillStyle = COL.danger;
  for (const b of built){
    if (b[4] <= 0.78 || b[2] <= 30) continue;
    const ax = Math.round(b[1] + b[3] * 0.5), ah = 10 + b[4] * 16;
    ctx.globalAlpha = L.alpha * (0.35 + 0.65 * Math.pow(Math.max(0, Math.sin(time * 2.2 + b[0])), 6));
    ctx.fillRect(ax - 1, b[2] - ah - 2, 2, 2);
  }

  /* 3ª passada: janelas. fillStyle fica fixo e o halo (drawImage) só sai
     nas mais brilhantes — é o que segura o custo do quadro.              */
  ctx.fillStyle = TH.win;
  const cell = L.cell, m = Math.max(3, cell * 0.32);
  const wW = Math.max(2, Math.round(cell * 0.34));
  const wH = Math.max(2, Math.round(cell * 0.46));
  const halo = L.halo !== false, hs = cell * 2.4, ho = cell * 0.95;
  const yEnd = Math.min(H, baseY + 20);
  for (const b of built){
    const i = b[0], bx = b[1], by = b[2], bw = b[3];
    const cols = Math.floor((bw - m) / cell);
    if (cols < 1) continue;
    const y0 = by + Math.max(6, cell * 0.6);
    const rows = Math.ceil((yEnd - y0) / cell);
    for (let cy = 0; cy < rows; cy++){
      const wy = Math.round(y0 + cy * cell);
      if (wy < -cell) continue;
      if (wy > H) break;
      for (let cx = 0; cx < cols; cx++){
        const h1 = hash(i * 131 + cx, L.seed * 17 + cy * 7);
        if (h1 > L.lit) continue;
        let a = 0.30 + (h1 / L.lit) * 0.55;
        if (h1 < L.lit * 0.14) a *= 0.45 + 0.55 * Math.sin(twk + i * 3.1 + cx + cy * 2.3);  // cintilância
        a *= L.alpha;
        if (a <= 0.04) continue;
        const wx = Math.round(bx + m + cx * cell);
        if (halo && a > 0.42){
          ctx.globalAlpha = a * 0.6;
          ctx.drawImage(glowCv, wx - ho, wy - ho, hs, hs);
        }
        ctx.globalAlpha = Math.min(1, a * 1.15);
        ctx.fillRect(wx, wy, wW, wH);
      }
    }
  }
  ctx.restore();
}

function drawPlatforms(){
  for (const p of platforms){
    if (p.x + p.w < cam.sx - 60 || p.x > cam.sx + W + 60) continue;
    ctx.fillStyle = COL.plat;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = COL.platTop;
    ctx.fillRect(p.x, p.y, p.w, 2);
    if (p.move){
      ctx.fillStyle = COL.dim;
      ctx.fillRect(p.x + p.w/2 - 9, p.y + 7, 18, 2);
    }
  }
}

function drawOrbs(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const o of orbs){
    if (o.x < cam.sx - 40 || o.x > cam.sx + W + 40) continue;
    const pulse = 0.75 + Math.sin(o.t * 3.4) * 0.25;
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, 16 * pulse);
    g.addColorStop(0, 'rgba(79,227,193,0.85)');
    g.addColorStop(0.35, 'rgba(79,227,193,0.25)');
    g.addColorStop(1, 'rgba(79,227,193,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, 16 * pulse, 0, 6.2832); ctx.fill();
    ctx.fillStyle = COL.orb;
    ctx.beginPath(); ctx.arc(o.x, o.y, 3.2, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function drawEnemies(){
  for (const e of enemies){
    if (e.x + e.w < cam.sx - 80 || e.x > cam.sx + W + 80) continue;
    const cx = e.x + e.w/2, cy = e.y + e.h/2;

    if (e.type === 'turret'){
      // telegrafia luminosa da carga
      if (e.charge > 0){
        const t = 1 - e.charge / 0.42;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const r = 10 + t * 20;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, 'rgba(255,47,109,' + (0.55 + t * 0.4) + ')');
        g.addColorStop(1, 'rgba(255,47,109,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = COL.enemy;
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.strokeStyle = COL.enemyLn;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(e.x + 0.5, e.y + 0.5, e.w - 1, e.h - 1);
      ctx.fillStyle = e.charge > 0 ? COL.danger : COL.dim;
      ctx.fillRect(cx - 3, cy - 3, 6, 6);
    } else if (e.type === 'walker'){
      ctx.fillStyle = COL.enemy;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y + e.h);
      ctx.lineTo(cx, e.y);
      ctx.lineTo(e.x + e.w, e.y + e.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = COL.enemyLn; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = COL.danger;
      ctx.fillRect(cx - 2 + e.dir * 4, e.y + e.h * 0.55, 4, 3);
    } else {
      // drone
      ctx.fillStyle = COL.enemy;
      ctx.beginPath();
      ctx.moveTo(cx, e.y);
      ctx.lineTo(e.x + e.w, cy);
      ctx.lineTo(cx, e.y + e.h);
      ctx.lineTo(e.x, cy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = COL.enemyLn; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const pulse = 0.5 + 0.5 * Math.sin(e.t * 6);
      const g = ctx.createRadialGradient(cx, cy + 8, 0, cx, cy + 8, 12 + pulse * 6);
      g.addColorStop(0, 'rgba(255,47,109,0.7)');
      g.addColorStop(1, 'rgba(255,47,109,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy + 8, 12 + pulse * 6, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }
}

function drawShots(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shots){
    const r = s.r * (s.kind === 'seeker' ? 1.15 + Math.sin(s.t * 14) * 0.12 : 1);
    const glowR = r * 5;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, glowR);
    g.addColorStop(0,    'rgba(255,255,255,0.95)');
    g.addColorStop(0.16, 'rgba(255,123,166,0.75)');
    g.addColorStop(0.42, 'rgba(255,47,109,0.30)');
    g.addColorStop(1,    'rgba(255,47,109,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, glowR, 0, 6.2832); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, r * 0.55, 0, 6.2832); ctx.fill();

    if (s.kind === 'seeker'){
      ctx.strokeStyle = 'rgba(255,47,109,0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2 + Math.sin(s.t * 10) * 2, 0, 6.2832); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawRings(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings){
    const a = clamp(r.life / r.max, 0, 1);
    ctx.strokeStyle = r.color === COL.player
      ? 'rgba(238,241,247,' + (a * 0.55) + ')'
      : 'rgba(255,47,109,' + (a * 0.9) + ')';
    ctx.lineWidth = 2 + a * 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.2832); ctx.stroke();
    if (r.color !== COL.player){
      const g = ctx.createRadialGradient(r.x, r.y, r.r * 0.6, r.x, r.y, r.r * 1.25);
      g.addColorStop(0, 'rgba(255,47,109,0)');
      g.addColorStop(0.7, 'rgba(255,47,109,' + (a * 0.28) + ')');
      g.addColorStop(1, 'rgba(255,47,109,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 1.25, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

function drawParts(){
  ctx.save();
  for (const p of parts){
    const a = clamp(p.life / p.max, 0, 1);
    if (p.glow){
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3.2);
      const base = p.color === COL.orb ? '79,227,193' : '255,47,109';
      g.addColorStop(0, 'rgba(255,255,255,' + (a * 0.8) + ')');
      g.addColorStop(0.4, 'rgba(' + base + ',' + (a * 0.45) + ')');
      g.addColorStop(1, 'rgba(' + base + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3.2, 0, 6.2832); ctx.fill();
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawPlayer(){
  if (player.dead) return;
  if (player.inv > 0 && Math.floor(player.inv * 22) % 2 === 0) return;

  const sq = player.squash;
  const w = player.w * (1 - sq * 0.28);
  const h = player.h * (1 + sq * 0.34);
  const x = player.x + (player.w - w) / 2;
  const y = player.y + (player.h - h);

  // rastro de velocidade
  if (Math.abs(player.vx) > 200){
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = COL.player;
    ctx.fillRect(x - player.vx * 0.018, y, w, h);
    ctx.restore();
  }

  ctx.fillStyle = COL.player;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(x + (player.face > 0 ? w - 7 : 3), y + 7, 4, 4);

  if (player.jumps === 0 && !player.grounded){
    ctx.strokeStyle = 'rgba(238,241,247,0.28)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
  }
}

function drawPops(){
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '600 13px ui-monospace, monospace';
  for (const p of pops){
    ctx.globalAlpha = clamp(p.life / 0.9, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

/* ── HUD ── */

function drawHUD(){
  const sector = sectorAt(distance);
  ctx.save();
  ctx.textBaseline = 'top';

  // pontuação
  ctx.fillStyle = COL.dim;
  ctx.font = '500 11px ui-monospace, monospace';
  ctx.letterSpacing = '2px';
  ctx.fillText('SCORE', 22, 20);
  ctx.fillStyle = COL.player;
  ctx.font = '600 40px ui-monospace, monospace';
  ctx.letterSpacing = '0px';
  ctx.fillText(String(Math.floor(score)).padStart(6, '0'), 20, 34);

  ctx.fillStyle = COL.dim;
  ctx.font = '500 11px ui-monospace, monospace';
  ctx.fillText('BEST ' + String(best).padStart(6, '0'), 22, 80);

  // vida
  for (let i = 0; i < player.maxHp; i++){
    const x = 22 + i * 16, y = 102;
    if (i < player.hp){ ctx.fillStyle = COL.player; ctx.fillRect(x, y, 10, 10); }
    else { ctx.strokeStyle = COL.dim; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, 9, 9); }
  }

  // setor + distância
  ctx.textAlign = 'right';
  ctx.fillStyle = COL.dim;
  ctx.font = '500 11px ui-monospace, monospace';
  ctx.fillText('SECTOR', W - 22, 20);
  ctx.fillStyle = TH.win;
  ctx.font = '600 28px ui-monospace, monospace';
  ctx.fillText(String(sector).padStart(2, '0'), W - 20, 34);
  ctx.fillStyle = COL.dim;
  ctx.font = '500 11px ui-monospace, monospace';
  ctx.fillText(TH.name + '  ·  ' + Math.floor(distance / 10) + ' M', W - 22, 70);

  // barra de progresso do setor
  const prog = (distance % 2600) / 2600;
  ctx.fillStyle = '#1b1f29';
  ctx.fillRect(W - 142, 90, 122, 3);
  ctx.fillStyle = TH.win;
  ctx.fillRect(W - 142, 90, 122 * prog, 3);


  // combo
  if (combo > 1){
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.orb;
    ctx.font = '600 18px ui-monospace, monospace';
    ctx.globalAlpha = clamp(comboTimer / 1.2, 0.2, 1);
    ctx.fillText('x' + combo, W / 2, 24);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* Virada de setor: clarão, varredura luminosa e nome do novo clima. */
function drawSectorFx(){
  if (sectorFx <= 0) return;
  const t = 1 - sectorFx;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rgba(TH.winRgb, 0.09 * sectorFx * sectorFx);
  ctx.fillRect(0, 0, W, H);

  const sw = clamp(t / 0.5, 0, 1);
  if (sw < 1){
    const x = -260 + sw * (W + 520);
    const g = ctx.createLinearGradient(x - 240, 0, x + 110, 0);
    g.addColorStop(0, rgba(TH.winRgb, 0));
    g.addColorStop(0.72, rgba(TH.winRgb, 0.15 * (1 - sw)));
    g.addColorStop(1, rgba(TH.winRgb, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = clamp(sectorFx * 1.7, 0, 1) * clamp(t * 7, 0, 1);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = COL.player;
  ctx.font = '600 26px ui-monospace, monospace';
  ctx.letterSpacing = '10px';
  ctx.fillText('SECTOR ' + String(curSector).padStart(2, '0'), W/2 + 5, H * 0.30);
  ctx.fillStyle = TH.win;
  ctx.font = '500 12px ui-monospace, monospace';
  ctx.letterSpacing = '6px';
  ctx.fillText(TH.name, W/2 + 3, H * 0.30 + 32);
  ctx.restore();
}

function drawVignette(){
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.35, W/2, H/2, Math.max(W,H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function panel(){
  ctx.fillStyle = rgba(TH.skyRgb, 0.74);
  ctx.fillRect(0, 0, W, H);
}

function drawMenu(){
  panel();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = COL.player;
  ctx.font = '600 64px ui-monospace, monospace';
  ctx.letterSpacing = '14px';
  ctx.fillText('VETOR', W/2 + 7, H/2 - 60);
  ctx.letterSpacing = '2px';
  ctx.fillStyle = COL.dim;
  ctx.font = '500 12px ui-monospace, monospace';
  ctx.fillText('ENDLESS PROCEDURAL PLATFORMER', W/2, H/2 - 24);

  ctx.fillStyle = COL.player;
  ctx.font = '500 13px ui-monospace, monospace';
  ctx.letterSpacing = '1px';
  const lines = ['A / D  or  ← →   MOVE',
                 'SPACE  JUMP  (double jump in air)',
                 'STOMP ENEMIES TO SCORE',
                 'P PAUSE  ·  R RESTART  ·  M MUTE'];
  if (isTouch) lines.push('TOUCH: LEFT SIDE MOVES · RIGHT SIDE JUMPS');
  lines.push('', isTouch ? 'PRESS SPACE OR TAP TO START' : 'PRESS SPACE TO START');
  lines.forEach((l, i) => {
    ctx.fillStyle = i === lines.length - 1 ? COL.orb : COL.dim;
    ctx.fillText(l, W/2, H/2 + 20 + i * 24);
  });

  if (best > 0){
    ctx.fillStyle = COL.dim;
    ctx.font = '500 11px ui-monospace, monospace';
    ctx.fillText('BEST ' + String(best).padStart(6,'0'), W/2, H - 60);
  }
  ctx.restore();
}

function drawDead(){
  ctx.save();
  ctx.fillStyle = rgba(TH.skyRgb, clamp(deadTime * 1.6, 0, 0.82));
  ctx.fillRect(0, 0, W, H);
  if (deadTime < 0.35){ ctx.restore(); return; }
  ctx.textAlign = 'center';
  ctx.fillStyle = COL.danger;
  ctx.font = '600 13px ui-monospace, monospace';
  ctx.letterSpacing = '5px';
  ctx.fillText('SIGNAL LOST', W/2, H/2 - 96);

  ctx.fillStyle = COL.player;
  ctx.font = '600 58px ui-monospace, monospace';
  ctx.letterSpacing = '0px';
  ctx.fillText(String(Math.floor(score)).padStart(6,'0'), W/2, H/2 - 34);

  ctx.fillStyle = COL.dim;
  ctx.font = '500 12px ui-monospace, monospace';
  ctx.letterSpacing = '2px';
  ctx.fillText('SECTOR ' + sectorAt(distance) + '   ·   ' + Math.floor(distance/10) + ' M', W/2, H/2 + 12);
  ctx.fillText(Math.floor(score) >= best ? 'NEW BEST' : 'BEST ' + String(best).padStart(6,'0'), W/2, H/2 + 38);

  if (deadTime > 0.6){
    ctx.fillStyle = COL.orb;
    ctx.font = '500 13px ui-monospace, monospace';
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 5);
    ctx.fillText(isTouch ? 'TAP TO TRY AGAIN' : 'SPACE OR R TO TRY AGAIN', W/2, H/2 + 86);
  }
  ctx.restore();
}

function drawPaused(){
  panel();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = COL.player;
  ctx.font = '600 28px ui-monospace, monospace';
  ctx.letterSpacing = '8px';
  ctx.fillText('PAUSED', W/2 + 4, H/2 - 10);
  ctx.fillStyle = COL.dim;
  ctx.font = '500 12px ui-monospace, monospace';
  ctx.letterSpacing = '2px';
  ctx.fillText('P TO RESUME', W/2, H/2 + 26);
  ctx.restore();
}

function render(){
  drawBackground();

  ctx.save();
  ctx.translate(-Math.round(cam.sx), -Math.round(cam.sy));
  drawPlatforms();
  drawOrbs();
  drawEnemies();
  drawPlayer();
  drawRings();
  drawShots();
  drawParts();
  drawPops();
  ctx.restore();

  drawVignette();
  drawSectorFx();

  if (state === 'menu') drawMenu();
  else {
    drawHUD();
    if (state === 'dead') drawDead();
    if (state === 'paused') drawPaused();
  }
  drawVolumeUI();          // sempre por cima e sempre clicável
}

/* ─────────────────────────────  LOOP  ───────────────────────────── */

let last = performance.now(), acc = 0;
const STEP = 1 / 120;

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;         // evita "túnel" após aba inativa
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 12){ update(STEP); acc -= STEP; }
  render();
}

resetWorld();
requestAnimationFrame(frame);
</script>
